spring:
  application:
    name: repro-client
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

geode:
  locator:
    host: geode
    port: 10334

repro:
  # broken | fixed (set with -Drepro.mode=... via JAVA_TOOL_OPTIONS)
  mode: broken
  downstream-millis: 3000

logging:
  level:
    org.apache.geode: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %m%n%wEx"
